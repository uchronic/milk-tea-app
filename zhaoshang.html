<script>
function tip(p) {
  if (!p.data) return p.name;
  if (p.data.desc) {
    return '<div style="font-weight:bold;color:#f0b030;margin-bottom:5px">'+p.name+'</div>'
      +'<div style="color:#c8e0ff;line-height:1.6">'+p.data.desc.replace('\n','<br>')+'</div>';
  }
  if (p.data.detail) {
    var parts=p.data.detail.split('|');
    var cat=parts[0], info=parts[1]||'';
    var color=p.seriesName==='硬件制造商'?'#ff9b7a':p.seriesName==='数据服务商'?'#ce93d8':'#69f7c5';
    return '<div style="font-weight:bold;color:'+color+';margin-bottom:4px">'+p.name+'</div>'
      +'<div style="color:#5b8db8;font-size:11px;margin-bottom:4px">'+cat+'</div>'
      +'<div style="color:#c8e0ff;line-height:1.6;max-width:200px">'+info+'</div>';
  }
  return p.name;
}

function initCallouts(chart) {
  // position:fixed wrapper 不受 body overflow:hidden 影响
  var wrap=document.createElement('div');
  wrap.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1000';
  document.body.appendChild(wrap);

  var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible';
  wrap.appendChild(svg);

  var boxes=CALLOUTS.map(function(c){
    var d=document.createElement('div');
    d.className='cbox';
    var h='<div class="cbox-city">◈ '+c.city+'</div>';
    c.categories.forEach(function(cat){
      h+='<div class="cbox-cat" style="color:'+(cat.color||'#3d6b9a')+'">'+cat.name+'</div>';
      h+='<div class="cbox-co">'+cat.companies.join('<br>')+'</div>';
    });
    d.innerHTML=h; wrap.appendChild(d); return d;
  });

  function draw(){
    // 强制浏览器计算布局，确保 offsetWidth/offsetHeight 有值
    void wrap.offsetHeight;
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    var W=window.innerWidth, H=window.innerHeight;
    CALLOUTS.forEach(function(c,i){
      var px=chart.convertToPixel({geoIndex:0},c.coords);
      if(!px||isNaN(px[0])) return;
      var box=boxes[i];
      var bw=box.offsetWidth||160, bh=box.offsetHeight||80;
      var bx,by,ex,ey;
      var aH=H-120-20, aW=W-80-80;
      if(c.side==='right'){
        bx=W-bw-18;
        by=c.pct!==undefined?(120+aH*c.pct):Math.max(120,Math.min(px[1]-bh/2,H-bh-20));
        by=Math.max(120,Math.min(by,H-bh-20)); ex=bx; ey=by+bh/2;
      } else if(c.side==='left'){
        bx=18;
        by=c.pct!==undefined?(120+aH*c.pct):Math.max(120,Math.min(px[1]-bh/2,H-bh-20));
        by=Math.max(120,Math.min(by,H-bh-20)); ex=bx+bw; ey=by+bh/2;
      } else if(c.side==='top'){
        by=90;
        bx=c.pct!==undefined?(80+aW*c.pct-bw/2):Math.max(20,Math.min(px[0]-bw/2,W-bw-20));
        bx=Math.max(20,Math.min(bx,W-bw-20)); ex=bx+bw/2; ey=by+bh;
      } else {
        by=H-bh-18;
        bx=c.pct!==undefined?(80+aW*c.pct-bw/2):Math.max(20,Math.min(px[0]-bw/2,W-bw-20));
        bx=Math.max(20,Math.min(bx,W-bw-20)); ex=bx+bw/2; ey=by;
      }
      box.style.left=bx+'px'; box.style.top=by+'px';
      var kx=(c.side==='right'||c.side==='left')?ex:px[0];
      var ky=(c.side==='top'||c.side==='bottom')?ey:px[1];
      var pl=document.createElementNS('http://www.w3.org/2000/svg','polyline');
      pl.setAttribute('points',px[0]+','+px[1]+' '+kx+','+ky+' '+ex+','+ey);
      pl.setAttribute('stroke','rgba(77,200,255,.5)'); pl.setAttribute('stroke-width','1.2');
      pl.setAttribute('fill','none'); pl.setAttribute('stroke-dasharray','5,3');
      svg.appendChild(pl);
      var ci=document.createElementNS('http://www.w3.org/2000/svg','circle');
      ci.setAttribute('cx',px[0]); ci.setAttribute('cy',px[1]); ci.setAttribute('r','5');
      ci.setAttribute('fill','rgba(77,200,255,.15)'); ci.setAttribute('stroke','#4dc8ff');
      ci.setAttribute('stroke-width','1.5'); svg.appendChild(ci);
      var ci2=document.createElementNS('http://www.w3.org/2000/svg','circle');
      ci2.setAttribute('cx',px[0]); ci2.setAttribute('cy',px[1]); ci2.setAttribute('r','2.5');
      ci2.setAttribute('fill','#4dc8ff'); svg.appendChild(ci2);
    });
  }
  chart.on('georoam',draw); chart.on('finished',draw);
  window.addEventListener('resize',function(){chart.resize();setTimeout(draw,80);});
  setTimeout(draw,500);
}
fetch('https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json')
  .then(function(r){return r.json();})
  .then(function(geo){
    echarts.registerMap('china',geo);
    document.getElementById('loading').style.display='none';
    var chart=echarts.init(document.getElementById('chart'));
    chart.setOption({
      backgroundColor:'#030d1e',
      tooltip:{trigger:'item',backgroundColor:'rgba(3,20,50,.92)',borderColor:'rgba(0,150,255,.35)',
        textStyle:{color:'#c8e0ff',fontSize:12},formatter:tip},
      geo:{map:'china',roam:true,zoom:1.22,center:[106,37],label:{show:false},
        itemStyle:{areaColor:'#071e3d',borderColor:'#1a4a7a',borderWidth:.8},
        emphasis:{itemStyle:{areaColor:'#0d3060'},label:{show:false}}},
      series:[
        {name:'试点城市',type:'scatter',coordinateSystem:'geo',data:PILOTS,symbolSize:7,
          itemStyle:{color:'rgba(77,200,255,.2)',borderColor:'rgba(77,200,255,.65)',borderWidth:1},
          label:{show:true,formatter:'{b}',position:'right',color:'rgba(77,200,255,.6)',fontSize:10},
          zlevel:1},
        {name:'产业高地',type:'effectScatter',coordinateSystem:'geo',
          data:HUBS.map(function(h){return{name:h.name,value:h.value,desc:h.desc};}),
          symbolSize:18,rippleEffect:{brushType:'stroke',scale:4,period:3},
          itemStyle:{color:'rgba(240,176,48,.85)',shadowColor:'#f0b030',shadowBlur:18},
          label:{show:true,formatter:function(p){return p.name;},position:'top',
            color:'#f0b030',fontSize:11,fontWeight:'bold'},zlevel:3},
        {name:'硬件制造商',type:'scatter',coordinateSystem:'geo',data:HARDWARE,symbolSize:13,
          itemStyle:{color:'#ff7043',shadowColor:'rgba(255,112,67,.7)',shadowBlur:8},
          label:{show:false},zlevel:4},
        {name:'数据服务商',type:'scatter',coordinateSystem:'geo',data:DATA_SVC,symbolSize:13,
          itemStyle:{color:'#ab47bc',shadowColor:'rgba(171,71,188,.7)',shadowBlur:8},
          label:{show:false},zlevel:4},
        {name:'场景运营商',type:'scatter',coordinateSystem:'geo',data:SCENE,symbolSize:13,
          itemStyle:{color:'#00e5a0',shadowColor:'rgba(0,229,160,.7)',shadowBlur:8},
          label:{show:false},zlevel:4}
      ]
    });
    initCallouts(chart);
    window.addEventListener('resize',function(){chart.resize();});
  })
  .catch(function(){document.getElementById('loading').textContent='地图加载失败，请检查网络后刷新';});
</script>
</body>
</html>
